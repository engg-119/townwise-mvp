<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Townwise share image</title>
    <!--
      The source of public/og/townwise.png, 1200 by 630. render.mts draws the map into it from
      src/marketing/map/geometry.ts: the nine states, the twelve town markers and the state labels, as the
      homepage map draws them. Colors are theme.ts tokens; the fonts are the site's own files.
      Layout: the wordmark, the line and the URL stay inside the square center crop (x 285 to 915). The map
      sits at scale 0.85, rising from the bottom right: Maine clears the line by about 50px, and markers or
      labels within 32px of an edge are left out.
    -->
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        font-weight: 400 700;
        font-stretch: 75% 100%;
        src: url('../../public/fonts/instrument-sans-v4-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 400 500;
        src: url('../../public/fonts/geist-mono-v6-latin.woff2') format('woff2');
      }
      :root {
        --ground: #080a0d;
        --state: #23272c;
        --line: #7b8187;
        --white: #eff2f6;
        --text2: #b5bbc2;
        --text3: #9a9fa6;
        --mint: #7bd2b4;
        --mint-ring: rgba(123, 210, 180, 0.4);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
      body { position: relative; font-family: 'Instrument Sans', sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }

      .copy { position: absolute; left: 0; right: 0; top: 60px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .wm { font-weight: 600; font-size: 116px; line-height: 1; letter-spacing: -0.03em; }
      .line { margin-top: 20px; width: 600px; font-size: 27px; line-height: 35px; color: var(--text2); text-wrap: balance; }
      .url { margin-top: 16px; font-family: 'Geist Mono', monospace; font-size: 22px; line-height: 28px; color: var(--text3); }

      .map { position: absolute; left: 312px; top: 121px; width: 850px; height: 739.5px; }
      .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .states { fill: var(--state); stroke: var(--line); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
      .ov { position: absolute; inset: 0; }
      .dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--mint); outline: 2px solid var(--mint-ring); outline-offset: 3px; }
      .st { position: absolute; transform: translate(-50%, -50%); font-family: 'Geist Mono', monospace; font-size: 15px; line-height: 20px; color: var(--text3); }
    </style>
  </head>
  <body>
    <div class="map" aria-hidden="true">
      <svg viewBox="0 0 1000 870"><path class="states" d="" /></svg>
      <div class="ov"></div>
    </div>
    <div class="copy">
      <h1 class="wm">Townwise</h1>
      <p class="line">Forecasts of daily guests and sales for restaurants and bars, from your town’s calendar.</p>
      <p class="url">townwise.tech</p>
    </div>
  </body>
</html>
