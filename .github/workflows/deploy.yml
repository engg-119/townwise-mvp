name: Deploy

# GitHub Free, private repository: no environments or branch protection. The gate is the `if` on every job
# plus the deploy identity's federated credential (exact subject: refs/heads/main of this repository), and
# it rests on only the owner having write access (infra/README.md). Repository-level variables only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The three build jobs run repository and npm code and get no id-token. Each uploads one tarball and
  # publishes its SHA-256.
  build-web:
    name: build-web
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - name: Required repository variables are set
        run: |
          set -euo pipefail
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_WEB_URL; do
            if [ -z "${!name}" ]; then echo "::error::repository variable $name is not set"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the web export (EXPO_PUBLIC_* from repository variables)
        run: npm run export:web -w @ckeith26/expo-shell
      - id: pack
        name: Add the Static Web Apps config (headers, single-page fallback) and pack
        run: |
          set -euo pipefail
          cp infra/web/staticwebapp.config.json client/.expo-export/staticwebapp.config.json
          tar -czf "$RUNNER_TEMP/web.tar.gz" -C client/.expo-export .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/web.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: ${{ runner.temp }}/web.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-api:
    name: build-api
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      image_id: ${{ steps.pack.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pack
        name: Build the API image (api/Dockerfile) and save it
        run: |
          set -euo pipefail
          docker build -f api/Dockerfile -t townwise-api:release .
          echo "image_id=$(docker image inspect townwise-api:release --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          docker save townwise-api:release | gzip -n > "$RUNNER_TEMP/api-image.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/api-image.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api
          path: ${{ runner.temp }}/api-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The forecast lab's image (modeling/lab/Dockerfile). Built on every release so the registry always holds the
  # current code; the lab job is pointed at it only when LAB_ENABLED is set (infra/README.md, step 20).
  build-lab:
    name: build-lab
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      image_id: ${{ steps.pack.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pack
        name: Build the lab image (modeling/lab/Dockerfile) and save it
        run: |
          set -euo pipefail
          docker build -f modeling/lab/Dockerfile --build-arg CODE_VERSION="$GITHUB_SHA" -t townwise-lab:release modeling/lab
          echo "image_id=$(docker image inspect townwise-lab:release --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          docker save townwise-lab:release | gzip -n > "$RUNNER_TEMP/lab-image.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/lab-image.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab
          path: ${{ runner.temp }}/lab-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The only job with an id-token (ci.yml's id-token-guard checks; the deploy identity trusts only this workflow
  # file on main, through job_workflow_ref). No checkout and no repository
  # or npm code. It verifies all three artifacts against the build jobs' outputs, then runs docker and Azure CLI
  # commands and two pinned actions (download-artifact, azure/login).
  deploy:
    name: deploy
    needs: [build-web, build-api, build-lab]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for id-townwise-gha-deploy; no stored Azure credentials
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_STATIC_WEB_APP: ${{ vars.AZURE_STATIC_WEB_APP }}
      WEB_SHA256: ${{ needs.build-web.outputs.sha256 }}
      API_SHA256: ${{ needs.build-api.outputs.sha256 }}
      API_IMAGE_ID: ${{ needs.build-api.outputs.image_id }}
      LAB_SHA256: ${{ needs.build-lab.outputs.sha256 }}
      LAB_IMAGE_ID: ${{ needs.build-lab.outputs.image_id }}
      LAB_ENABLED: ${{ vars.LAB_ENABLED }}
    steps:
      - name: Required repository variables are set
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_ACR_NAME \
              AZURE_CONTAINER_APP AZURE_STATIC_WEB_APP; do
            if [ -z "${!name}" ]; then echo "::error::repository variable $name is not set"; exit 1; fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab
          path: ${{ runner.temp }}/in
      - name: Verify the artifacts against the build jobs' SHA-256
        run: |
          set -euo pipefail
          for sum in "$WEB_SHA256" "$API_SHA256" "$LAB_SHA256"; do
            if ! [[ "$sum" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::missing or malformed SHA-256 output"; exit 1; fi
          done
          for id in "$API_IMAGE_ID" "$LAB_IMAGE_ID"; do
            if ! [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::missing image id"; exit 1; fi
          done
          cd "$RUNNER_TEMP/in"
          printf '%s  web.tar.gz\n%s  api-image.tar.gz\n%s  lab-image.tar.gz\n' "$WEB_SHA256" "$API_SHA256" "$LAB_SHA256" | sha256sum --check --strict -
          # Only plain files and directories, and no path that leaves the folder: no absolute names, no ".."
          # component, no links, devices or FIFOs. The upload container mounts this folder read-only.
          # grep without -q reads the whole listing, so tar never dies of SIGPIPE under pipefail.
          if tar -tzf web.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))' > /dev/null; then
            echo "::error::web artifact has a path outside its folder"; exit 1
          fi
          mkdir "$GITHUB_WORKSPACE/web"
          tar -xzf web.tar.gz -C "$GITHUB_WORKSPACE/web" --no-same-owner --no-same-permissions
          if [ -n "$(find "$GITHUB_WORKSPACE/web" ! -type f ! -type d)" ]; then
            echo "::error::web artifact has entries that are not plain files or directories"; exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: push
        name: Load the API image and push it to the registry
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/in/api-image.tar.gz" > /dev/null
          loaded="$(docker image inspect townwise-api:release --format '{{.Id}}')"
          if [ "$loaded" != "$API_IMAGE_ID" ]; then echo "::error::loaded image differs from the built one"; exit 1; fi
          registry="$AZURE_ACR_NAME.azurecr.io"
          az acr login --name "$AZURE_ACR_NAME" --output none
          docker tag townwise-api:release "$registry/townwise-api:$GITHUB_SHA"
          docker push --quiet "$registry/townwise-api:$GITHUB_SHA"
          ref="$(docker image inspect "$registry/townwise-api:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^$registry/townwise-api@sha256:" | head -n 1)"
          if [ -z "$ref" ]; then echo "::error::no registry digest after push"; exit 1; fi
          docker logout "$registry" > /dev/null
          echo "image=$ref" >> "$GITHUB_OUTPUT"
      - id: push-lab
        name: Load the lab image and push it to the registry
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/in/lab-image.tar.gz" > /dev/null
          loaded="$(docker image inspect townwise-lab:release --format '{{.Id}}')"
          if [ "$loaded" != "$LAB_IMAGE_ID" ]; then echo "::error::loaded lab image differs from the built one"; exit 1; fi
          registry="$AZURE_ACR_NAME.azurecr.io"
          az acr login --name "$AZURE_ACR_NAME" --output none
          docker tag townwise-lab:release "$registry/townwise-lab:$GITHUB_SHA"
          docker push --quiet "$registry/townwise-lab:$GITHUB_SHA"
          ref="$(docker image inspect "$registry/townwise-lab:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^$registry/townwise-lab@sha256:" | head -n 1)"
          if [ -z "$ref" ]; then echo "::error::no registry digest after push"; exit 1; fi
          docker logout "$registry" > /dev/null
          # The digest is not a secret; the runbook (infra/README.md, step 20) reads it here for lab_image.
          echo "lab image: $ref"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
      - name: Point the Container App at the image digest and wait for the revision
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          # --no-wait, then poll the app itself: the deploy role reads the app, not the location-level
          # operation status that a waiting update would poll.
          az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-name api --image "$IMAGE" --no-wait --output none
          for _ in $(seq 1 60); do
            sleep 10
            read -r state latest ready < <(az containerapp show --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '[properties.provisioningState, properties.latestRevisionName, properties.latestReadyRevisionName]' \
              --output tsv | tr '\t' ' ')
            echo "provisioning $state; latest $latest; ready $ready"
            if [ "$state" = Failed ]; then echo "::error::Container App update failed"; exit 1; fi
            if [ "$state" = Succeeded ] && [ "$latest" = "$ready" ]; then exit 0; fi
          done
          echo "::error::revision $latest did not become ready"
          exit 1
      # Only once the owner has applied the lab (infra/README.md, step 20) and set LAB_ENABLED: before that the job
      # does not exist, and the update would fail the release.
      - name: Point the lab job at the image digest
        if: env.LAB_ENABLED == 'true'
        env:
          IMAGE: ${{ steps.push-lab.outputs.image }}
        run: |
          set -euo pipefail
          az containerapp job update --name caj-townwise-lab --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-name lab --image "$IMAGE" --output none
      # The upload client runs from its image pinned by digest (not the Static Web Apps action, which builds
      # FROM a moving tag). docker run passes only the variables named with -e: the container gets the token
      # and the read-only web folder, and no ACTIONS_ID_TOKEN_REQUEST_* variables, Azure CLI session or
      # docker socket. The token never leaves this step (no step output). GITHUB_WORKSPACE is the one non-INPUT_
      # variable: the client resolves app_location against it (falling back to its working directory,
      # /bin/staticsites), as it does inside the official action's container.
      - name: Fetch the Static Web Apps deployment token, sign out of Azure, upload the web build
        env:
          # mcr.microsoft.com/appsvc/staticappsclient, the "prev" tag (2026-09-28); "stable" (2026-10-29) is
          # inside the 7-day release-age window.
          SWA_CLIENT: mcr.microsoft.com/appsvc/staticappsclient@sha256:f04ad21456c71d0938dfd7f031a8906abe8c5ccaa7724472df5f4a653bc00684
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list --name "$AZURE_STATIC_WEB_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey --output tsv)"
          if [ -z "$token" ]; then echo "::error::no deployment token"; exit 1; fi
          echo "::add-mask::$token"
          az logout
          INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN="$token" docker run --rm \
            -e INPUT_ACTION=upload -e INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN -e INPUT_APP_LOCATION=web \
            -e INPUT_SKIP_APP_BUILD=true -e GITHUB_WORKSPACE=/github/workspace \
            -v "$GITHUB_WORKSPACE/web:/github/workspace/web:ro" -w /github/workspace \
            "$SWA_CLIENT" sh -c 'cd /bin/staticsites && ./StaticSitesClient upload'
      - name: Smoke check (prints only the status)
        run: |
          set -uo pipefail
          for _ in $(seq 1 12); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
              https://api.townwise.tech/healthz || true)"
            echo "api.townwise.tech/healthz: $status"
            if [ "$status" = 200 ]; then exit 0; fi
            sleep 10
          done
          exit 1
