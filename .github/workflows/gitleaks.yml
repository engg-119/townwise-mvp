name: Gitleaks

on:
  pull_request:          # no paths filter, ever (T12)
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # Required check; do not rename (T17).
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # a shallow clone hides a secret added then removed inside the PR
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/no-ignore"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Canary (this PR's config must catch a key committed in a .env file)
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/canary"
          git init -q "$canary"
          prefix=AKIA   # split so this file never holds a key-shaped string
          printf 'AWS_ACCESS_KEY_ID=%s\n' "${prefix}QWERTYUIOPASDFGH" > "$canary/.env"
          git -C "$canary" add .env
          git -C "$canary" -c user.email=ci@example.invalid -c user.name=ci commit -qm canary
          status=0
          gitleaks git "$canary" --config .gitleaks.toml --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" \
            --ignore-gitleaks-allow --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/canary.json" || status=$?
          if [ "$status" -ne 1 ] || ! jq -e 'any(.[]; .RuleID == "aws-access-token" and .File == ".env")' \
              "$RUNNER_TEMP/canary.json" > /dev/null; then
            echo "::error::gitleaks (exit $status) did not report aws-access-token for a key in a committed .env"
            exit 1
          fi
      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # gitleaks reads .gitleaksignore from the scan root whatever --gitleaks-ignore-path says.
          if [ -e .gitleaksignore ]; then echo "::error::.gitleaksignore is not allowed: rotate a real secret, rewrite a fixture"; exit 1; fi
          for f in .semgrepignore .checkov.yaml .checkov.yml; do
            if [ -e "$f" ]; then echo "::error::$f is not allowed: it would switch checks off for the whole repo"; exit 1; fi
          done
          cfg="$RUNNER_TEMP/gitleaks-scan.toml"
          args=(--config "$cfg" --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" --ignore-gitleaks-allow --no-banner --redact)
          if [ "$EVENT_NAME" = pull_request ]; then
            # The base branch's rules, never the PR's own: a PR cannot loosen the scan it is judged by.
            # Before .gitleaks.toml exists on the base, the default rules apply.
            git show "$BASE_SHA:.gitleaks.toml" > "$cfg" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$cfg"
            gitleaks git . --log-opts="$BASE_SHA..$HEAD_SHA" "${args[@]}"
          else
            # Full history, so new detector rules reach secrets deleted from HEAD but kept in history.
            # Cheap while the repo is young. coffee-chat's full history took 166 minutes
            # (security-gates.yml:93-96); if this nears the timeout, switch to `gitleaks dir .`.
            cp .gitleaks.toml "$cfg"
            gitleaks git . "${args[@]}"
          fi
