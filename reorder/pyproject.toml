[project]
name = "sawtooth-reorder"
version = "0.1.0"
description = "Reorder recommendations for a bar. The forecast notebook is not part of this package."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3", "streamlit>=1.67.0"]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reorder*"]
