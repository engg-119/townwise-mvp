# Suppressions for the osv-scanner job in .github/workflows/security.yml. Any other finding fails.
# Every entry says why upgrading cannot close it yet and expires within 30 days; "noisy" is not a reason.
# When a fix is installable under min-release-age=7, take it (directly or as an exact root `overrides` entry)
# and delete the entry. If a removed id reappears, something moved backwards: fix it, do not re-list it.
# Checked 2026-11-04. None of these packages is in the API release or the web bundle; all are build, lint or
# test tooling (Expo CLI and config, Jest, ESLint), or notebook tooling for eda/ and modeling/ (checked 2026-11-13).

